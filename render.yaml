# Render Blueprint — https://render.com/docs/blueprint-spec
# New → Blueprint → point at this repo. Then set the two secret env vars
# (DATABASE_URL, DATABASE_AUTH_TOKEN) in the dashboard.
services:
  - type: web
    name: mindfultasks
    runtime: node
    plan: free
    # --include=dev: NODE_ENV=production (below) otherwise skips the build tools.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
