name: Deploy japandi-v2 prototype to GitHub Pages

# Publishes the static prototype at prototype/japandi-v2/ (Supabase is its
# backend, called straight from the browser — no build step needed).
# The production app is NOT served from Pages; it runs on Render.

on:
  push:
    branches: [main]
    paths:
      - 'prototype/japandi-v2/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/japandi-v2
      - id: deployment
        uses: actions/deploy-pages@v4
