# fly.toml — MindfulTasks v2
# Deploy with:  flyctl deploy   (after `flyctl auth login` and a one-time
# `flyctl volumes create mindfultasks_data --size 1 --region <region>`)

app = "mindfultasks-ssisss1"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  DATABASE_PATH = "/data/mindfultasks.db"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[mounts]
  source = "mindfultasks_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
